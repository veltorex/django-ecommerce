{% extends "base.html" %}
{% load static %}

{% block content %}
<main>
    <form 
        method="post" 
        action="{% url 'products:product-delete' product.pk %}"
        onsubmit="return confirm('Are you sure you want to delete this product?')"    
    >
        {% csrf_token %}
        <h2>
            {{ product.title }}
        </h2>
        <p>
            {{ product.description }}
        </p>
        <button type="submit">Delete</button>
    </form>
</main>

{% endblock content %}
