{% extends "base.html" %}
{% load static %}

{% block extra_css %}

{% endblock extra_css %}

{% block content %}
<main class="product-list">
    <h1 class="product-list__title">Products</h1>
    {% for product in products %}
    {% include 'components/product-card.html' with product=product %}
    {% endfor %}
</main>
{% endblock content %}
