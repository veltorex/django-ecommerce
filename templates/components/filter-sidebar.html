<aside class="filter-sidebar">
    <div class="filter-sidebar__header">
        <h2>Filters</h2>
    </div>

    <form class="filter-sidebar__form" method="get">

        <section class="filter-sidebar__section">
            <h3>Category</h3>

            {% for category in categories %}
            <label>
                <input
                    type="checkbox"
                    name="category"
                    value="{{ category.id }}"
                    {% if category.id|stringformat:"s" in selected_category %}checked{% endif %}
                >
                {{ category.name }}
            </label>
            {% endfor %}
        </section>

        <section class="filter-sidebar__section">
            <h3>Price</h3>

            <div class="filter-sidebar__price">
                <input
                    type="number"
                    name="min_price"
                    placeholder="Min"
                    value="{{ min_price }}"
                >

                <input
                    type="number"
                    name="max_price"
                    placeholder="Max"
                    value="{{ max_price }}"
                >
            </div>
        </section>

        <section class="filter-sidebar__section">
            <h3>Sort By</h3>

            <select name="sort">
                <option value="">Default</option>
                <option value="price-low" {% if sort_by == "price-low" %}selected{% endif %}>
                    Price: Low to High
                </option>
                <option value="price-high" {% if sort_by == "price-high" %}selected{% endif %}>Price: High to Low</option>
                <option value="newest" {% if sort_by == "newest" %}selected{% endif %}>Newest</option>
            </select>
        </section>

        <div class="filter-sidebar__actions">
            <button type="submit" class="filter-sidebar__apply">
                Apply Filters
            </button>
            <button type="button" class="filter-sidebar__clear" onclick="location.href='{% url 'product-list' %}'">
                Clear
            </button>
        </div>
    </form>
</aside>
