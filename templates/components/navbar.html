        type="button"
        class="navbar__menu"
        aria-label="Open menu"
        aria-expanded="false"
    >

        <span></span>
        <span></span>
    </button>
    <a href="{% url 'products:product-list' %}" class="navbar__brand">Store</a>

    <div class="navbar__actions">

        <div class="navbar__links">
            <a href="{% url 'products:product-list' %}" class="navbar__link">Products</a>
            <a href="#" class="navbar__link">About</a>
            <a href="#" class="navbar__link">Contact</a>
        </div>

            <a href="{% url 'login' %}" class="navbar__login">
                Login
            </a>
        {% else %}
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="navbar__logout">
                    Logout
                </button>
            </form>
        {% endif %}
    </div>
</nav>
