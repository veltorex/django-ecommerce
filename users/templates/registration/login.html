{% extends "base.html" %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'users/css/authentication.css' %}">
{% endblock extra_css %}

{% block title %}Login{% endblock title %}

{% block content %}
    <main class="auth">
        <form action="" method="post" class="auth__form">
            {% csrf_token %}
            {{ form.as_p }}
    
            <button type="submit" class="auth__button">Login</button>
        </form>
    </main>
{% endblock content %}
