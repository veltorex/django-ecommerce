{% extends "base.html" %}

{% block title %}Register{% endblock title %}

{% block content %}
    <main class="auth">
        <form action="{% url 'users:register' %}" method="post" class="auth__form">
            {% csrf_token %}
            {{ form.as_p }}
    
            <button type="submit" class="auth__button">Register</button>
        </form>
    </main>
{% endblock content %}
