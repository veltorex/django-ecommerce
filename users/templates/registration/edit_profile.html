{% extends "base.html" %}

{% block title %}Edit Profile{% endblock title %}

{% block content %}
    <main class="auth">
        <form action="{% url 'users:edit-profile' %}" method="post" endtype="multipart/form-data" class="auth__form">
            {% csrf_token %}
            {{ form.as_p }}
    
            <button type="submit" class="auth__button">Save</button>
        </form>
    </main>
{% endblock content %}
