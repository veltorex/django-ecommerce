{% extends "base.html" %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'users/css/authentication.css' %}">
{% endblock extra_css %}

{% block title %}Profile{% endblock title %}

{% block content %}
    <main class="profile">
        <div>
            <h2 class="profile__fullname">{{ profile.first_name }} {{ profile.last_name }}</h2>
            <p class="profile__email">{{ profile.user.email }}</p>
        </div>
    </main>
{% endblock content %}
