{% extends "base.html" %}

{% block title %}Cart{% endblock title %}

{% block content %}
    <main>
        {% for item in cart_items %}
            <div>
                <h3>{{ item.product.title }}</h3>
                <p>{{ item.product.price }}</p>
                <form method="post" action="{% url 'cart:remove' item.id %}">
                    {% csrf_token %}
                    <button type="submit">Remove</button>
                </form>
            </div>
        {% endfor %}
    </main>
{% endblock content %}
