{% extends "base.html" %}

{% block title %}Cart{% endblock title %}

{% block content %}
    <main>
        {% for item in cart_items %}
            <div>
                <h3>{{ item.product.title }}</h3>
                <p>{{ item.product.price }}</p>
            </div>
            {% include "components/cart-actions.html" %}
        {% endfor %}
    </main>
{% endblock content %}
